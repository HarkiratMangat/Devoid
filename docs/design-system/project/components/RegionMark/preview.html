<!-- @dsCard group="Marks" height=470 subtitle="only the disputed pixels, only on the cut side" -->
<div class="wipe chk" style="--seam:50%">
  <img src="/_blob/bddbc28c83499b6f1cc003ad20cbc984" alt="">
  <img class="after" src="/_blob/b88f4fb692f9aa5b23e6cd8641458dea" alt="">
  <div class="seam"></div>
  <div class="qregion" data-l="24" data-w="40" style="left:24%;top:34%;width:40%;height:32%;--qseam:65%"><b>Region 1</b></div>
  <span class="wipetag l">keep it</span><span class="wipetag r">cut it</span>
</div>
<script>
document.querySelectorAll('.wipe').forEach(function (w) {
  var q = w.querySelector('.qregion');
  function set(x) {
    var r = w.getBoundingClientRect(), p = Math.max(4, Math.min(96, (x - r.left) / r.width * 100));
    w.style.setProperty('--seam', p + '%');
    if (q) { var l = parseFloat(q.dataset.l), wd = parseFloat(q.dataset.w);
      q.style.setProperty('--qseam', Math.max(0, Math.min(100, (p - l) / wd * 100)) + '%'); }
  }
  w.addEventListener('pointerdown', function (e) { w.setPointerCapture(e.pointerId); set(e.clientX); });
  w.addEventListener('pointermove', function (e) { if (w.hasPointerCapture(e.pointerId)) set(e.clientX); });
});
</script>
