<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devoid</title>
<script>try{if(localStorage.getItem('devoid-lamp')==='light')document.documentElement.className='lamp-light'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,600;62..125,700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="canvas.css">
</head>
<body>

<div class="app">
  <header class="chrome">
    <span class="wordmark" aria-label="Devoid">DEV<i aria-hidden="true"></i>ID</span>
    <span class="crumb" id="crumb"></span>
    <span class="grow"></span>
    <button class="btn" id="add">Add files</button>
    <button class="lamp" id="lamp" aria-label="Lighting"><b></b></button>
    <button class="btn go" id="primary">Save 6</button>
  </header>

  <div class="table">
    <!-- the queue, only while something is open -->
    <nav class="edge" id="edge" aria-label="Everything else" hidden></nav>

    <div class="work">
      <!-- nothing selected: the strip fills the space -->
      <div class="sheet chk" id="sheet"></div>

      <!-- one open -->
      <div class="open" id="open" hidden>
        <div class="openhead"><h1 id="openname"></h1><p id="openstate"></p></div>
        <div class="stage chk" id="stage">
          <div class="wipe" id="wipe">
            <div class="aftbg chk-s" id="aftbg"></div>
            <img id="before" src="assets/megaphone.src.gif" alt="">
            <img id="after" class="after" src="assets/megaphone.gif" alt="">
            <span class="seam" id="seam" aria-hidden="true"></span>
            <span class="wipetag l">as it came</span>
            <span class="wipetag r">cut</span>
          </div>
          <!-- the plotter draws here. Sized and placed onto #wipe by canvas.js;
               inert until a tool is picked up, so the seam still drags. -->
          <canvas id="regioncanvas" aria-label="Regions drawn on the artwork"></canvas>
        </div>
        <div id="regiontools"></div>
        <div class="ledger" id="ledger"></div>
        <div class="film">
          <div class="filmhead"><span id="onion">onion skin · 2 frames</span><span id="fcount"></span></div>
          <div class="frames" id="frames"></div>
        </div>
      </div>

      <!-- the empty table. emptiness is the subject, so no illustration. -->
      <div class="empty chk" id="empty" hidden>
        <div>
          <p class="big">Nothing on the table.</p>
          <p>Drop something in.</p>
        </div>
      </div>
    </div>

    <aside class="drawer" id="drawer" hidden></aside>
    <nav class="tabs" id="tabs" aria-label="Panels"></nav>
  </div>
</div>

<script src="app.js"></script>
<script src="canvas.js"></script>
</body>
</html>
