# Stage 6 — packaging (PLAN.md 6.2/6.3).
#
# This lives in its own file rather than package.json's "build" field because
# electron-builder refuses to load from package.json while a root-level
# "directories" key is present, and that key is Stage 0's npm metadata.
#
# ⚠️ SIGNING — a LOCAL, SELF-SIGNED identity, not a Developer ID (2026-09-06 17:05 EDT).
# `mac.identity: DEVOID` names a self-signed Code Signing certificate created in
# Keychain Access. It is enough to produce a real, verifiable seal and — the
# actual reason it is here — it is the ONLY way to exercise hardenedRuntime and
# build/entitlements.mac.plist without an Apple Developer account. Those
# entitlements exist because a signed app may not spawn the unsigned .venv
# interpreter without them, and until this identity existed they had never run.
#
# ⛔ WHAT THIS IS NOT. It is not Apple-issued, so it does NOT satisfy Gatekeeper
# on any other Mac, it can never be notarised, and it does NOT unblock
# Check for Updates — Squirrel.Mac needs a signature the destination machine
# trusts, and the repository being private is a second, independent blocker.
# See devoid-deferred-list.md, "Devoid cannot install its own updates".
#
# Notarisation stays driven entirely by environment variables, all unset:
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  — notarisation
# CSC_LINK / CSC_KEY_PASSWORD still override `identity` when a real Developer ID
# certificate arrives. See README.md "Packaging"; set notarize: true then.
#
# ⚠️ WHAT MAKES THIS RUN OUTSIDE THE REPO (6.3), and why it is arranged this way:
#
#   • server/ and web/ ship as extraResources, NOT inside app.asar. Python
#     cannot read an asar, and Python is what imports the server AND serves
#     web/ as static files. In the asar they are simply invisible to it.
#   • .venv ships as extraResources too, as `pyvenv`. It is a venv, so it still
#     needs its base interpreter — /Library/Frameworks/Python.framework/
#     Versions/3.11 — which is a system-wide framework install, not part of
#     this checkout. That is what the app depends on now, instead of the repo.
#   • The engine itself is still resolved at runtime (server/engine.py): via
#     $DEVOID_SKILL, devoid.config.json, or the documented path in
#     /Applications/Claude Code/Gif-Background-Remover.
#
#     ⚠️ NOT BUNDLED IS A GAP, NOT A DECISION (corrected 2026-09-07 20:38 EDT).
#     This comment used to argue the skill "must not be forked into a copy
#     that silently drifts" -- a limitation dressed as a principle. The engine
#     is ONE 636 KB Python file whose only third-party imports (numpy, PIL,
#     scipy) already ship inside this bundle, at 149 MB of ~170 MB. And the
#     argument runs backwards: not bundling GUARANTEES drift, because the user
#     runs whatever they happened to clone -- which is how a floor of v6.3.3
#     came to sit above a newest release of v6.3.0. checkForUpdates is the
#     mechanism for the drift it was worried about. Filed [P1 . M].

appId: com.harkirat.devoid
productName: Devoid
copyright: Devoid — a front end for the gif-background-remover skill

directories:
  output: dist
  buildResources: build

# ⚠️ Dereferences the venv's escaping absolute symlink before signing.
# Without it the signer walks OUT of the bundle. See build/afterPack.js.
afterPack: build/afterPack.js

files:
  - main.js
  - lib/**/*.js
  - package.json
  - '!**/__pycache__'
  - '!**/*.pyc'
  - '!.venv/**'
  - '!tests/**'
  - '!docs/**'
  - '!scripts/**'
  - '!prototype/**'
  - '!dist/**'

extraResources:
  # ⚠️ The engine, copied here by scripts/prepack-engine.mjs (2026-09-07 21:32 EDT), which
  # `npm run dist` runs first and which FAILS the build if the engine or either
  # of its two LGPL texts is missing. server/engine.py takes it as the LAST
  # candidate, after $DEVOID_SKILL, devoid.config.json and the documented path.
  - from: build/engine
    to: engine
    filter: ['**/*']
  - from: server
    to: server
    filter: ['**/*.py', '!**/__pycache__/**']
  - from: web
    to: web
    filter: ['**/*', '!**/__pycache__/**']
  - from: .venv
    to: pyvenv
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!lib/**/pip/**'
      - '!lib/**/setuptools/**'
      - '!**/tests/**'
      - '!**/test/**'
      # ⚠️ MEASURED, 2026-09-07 10:57 EDT. The venv is 199 MB and scipy (99),
      # numpy (36) and Pillow (14) are 149 of it — those ship. What follows is
      # ~36 MB of build and test machinery the app never imports at runtime.
      # Pruning does NOT make the app portable; it only makes the bundle
      # smaller. Portability is the first-run check in main.js.
      - '!lib/**/_pytest/**'
      - '!lib/**/pytest/**'
      - '!lib/**/pygments/**'
      - '!lib/**/pkg_resources/**'
      - '!lib/**/iniconfig/**'
      - '!lib/**/pluggy/**'

mac:
  icon: build/icon.icns
  identity: DEVOID
  category: public.app-category.graphics-design
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false

dmg:
  title: Devoid ${version}
